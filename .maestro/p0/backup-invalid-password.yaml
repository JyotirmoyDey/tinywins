appId: com.plainleaf.tinywins
---
# A wrong password must leave the current local check-in untouched.
# The exported encrypted backup is stored through SAF in public Downloads.
- evalScript: ${output.activityName = 'P0 Backup Guard'}
- evalScript: ${output.backupPassword = 'TinyWins-P0-Backup-2026!'}
- evalScript: ${output.wrongPassword = 'TinyWins-P0-Wrong-2026!'}
- launchApp
- assertVisible:
    id: home-screen

# Start from a clean database while retaining the Expo development client and
# any previously exported files.
- tapOn:
    id: nav-profile
- tapOn:
    id: delete-local-data
- assertVisible: '^Delete all local TinyWins data\?$'
- tapOn: (?i)^Delete local data$
- extendedWaitUntil:
    visible: '^Local data deleted$'
    timeout: 60000
- tapOn: (?i)^OK$
- tapOn:
    id: nav-home
- assertVisible:
    id: home-empty-state

# New items already have the three editable default levels.
- runFlow:
    file: ../p1/helpers/create-activity.yaml
- tapOn:
    id: .*activity-slider-.+
    text: '^${output.activityName}, how did it go today\?.*'
    point: 90%,50%
- assertVisible:
    id: .*activity-current-level-.+
    text: '^Quite a bit$'

# Export with the correct password.
- tapOn:
    id: nav-profile
- tapOn:
    id: profile-backup
- assertVisible:
    id: backup-screen
- tapOn:
    id: backup-open-create
- tapOn:
    id: backup-create-password
- inputText: ${output.backupPassword}
- tapOn:
    id: backup-confirm-password
- inputText: ${output.backupPassword}
- hideKeyboard
- tapOn:
    id: backup-create-encrypted
- extendedWaitUntil:
    visible:
      id: backup-status
    timeout: 120000
- assertVisible:
    id: backup-status
    text: ^Encrypted backup ready.*
- tapOn:
    id: backup-save-file
- assertVisible: Use this folder
- tapOn: Use this folder
- runFlow:
    when:
      visible: Allow
    commands:
      - tapOn: Allow
- extendedWaitUntil:
    visible:
      id: backup-status
    timeout: 60000
- assertVisible:
    id: backup-status
    text: .*saved to your chosen folder.*
- copyTextFrom:
    id: backup-status
- evalScript: ${output.backupFilename = maestro.copiedText.match(/tinywins-backup-[^\s]+\.tinywins/)[0]}
- assertVisible:
    id: backup-status
    text: .*${output.backupFilename}.*
- tapOn:
    id: backup-done
- tapOn:
    id: backup-back
- tapOn:
    id: nav-home

# Change the existing check-in after export. A failed import must preserve this
# newer value instead of restoring the exported value or deleting the item.
- tapOn:
    id: .*activity-slider-.+
    text: '^${output.activityName}, how did it go today\?.*'
    point: 10%,50%
- assertVisible:
    id: .*activity-current-level-.+
    text: '^Not today$'

# Select the actual exported file, then try a different password.
- tapOn:
    id: nav-profile
- tapOn:
    id: profile-backup
- tapOn:
    id: backup-open-import
- runFlow:
    when:
      visible: Files in TinywinsBackup
    commands:
      - tapOn: Download
- assertVisible: TinywinsBackup
- tapOn: TinywinsBackup
- scrollUntilVisible:
    element: ${output.backupFilename}
    direction: DOWN
- tapOn: ${output.backupFilename}
- assertVisible:
    id: backup-import-password
- tapOn:
    id: backup-import-password
- inputText: ${output.wrongPassword}
- hideKeyboard
- tapOn:
    id: backup-preview
- extendedWaitUntil:
    visible:
      id: backup-error
    timeout: 30000
- assertVisible:
    id: backup-error
    text: '^Incorrect password or damaged backup file\.$'
- assertNotVisible:
    id: backup-restore
- assertNotVisible: '^Restore complete$'

# Confirm the single post-export check-in remains unchanged, including after
# an app restart. No repeated per-level/history walkthrough is needed here.
- tapOn:
    id: backup-back
- tapOn:
    id: backup-back
- tapOn:
    id: nav-home
- assertVisible:
    id: .*activity-name-.+
    text: '^${output.activityName}$'
- assertVisible:
    id: .*activity-current-level-.+
    text: '^Not today$'
- stopApp
- launchApp
- assertVisible:
    id: home-screen
- assertVisible:
    id: .*activity-name-.+
    text: '^${output.activityName}$'
- assertVisible:
    id: .*activity-current-level-.+
    text: '^Not today$'
