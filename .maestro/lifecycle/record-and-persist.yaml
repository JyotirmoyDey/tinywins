appId: com.plainleaf.tinywins
---
# Requires smoke/create-and-persist.yaml after any local-data reset.
# Reuses its three default levels: Not today, A little, Quite a bit.
# Does not clear data or create an activity. Can be rerun on a recorded fixture.
- launchApp
- assertVisible:
    id: home-screen
- scrollUntilVisible:
    element:
      id: .*activity-card-.+
      containsDescendants:
        - id: .*activity-name-.+
          text: ^Maestro Persistence Test$
    direction: DOWN
# A center tap on the identified three-position slider commits A little.
- tapOn:
    id: .*activity-slider-.+
    text: '^Maestro Persistence Test, how did it go today\?.*'
- assertVisible:
    id: .*activity-card-.+
    containsDescendants:
      - id: .*activity-name-.+
        text: ^Maestro Persistence Test$
      - id: .*activity-current-level-.+
        text: ^A little$
- waitForAnimationToEnd
- stopApp
- launchApp
- assertVisible:
    id: home-screen
- scrollUntilVisible:
    element:
      id: .*activity-card-.+
      containsDescendants:
        - id: .*activity-name-.+
          text: ^Maestro Persistence Test$
    direction: DOWN
- assertVisible:
    id: .*activity-card-.+
    containsDescendants:
      - id: .*activity-name-.+
        text: ^Maestro Persistence Test$
      - id: .*activity-current-level-.+
        text: ^A little$
