appId: com.plainleaf.tinywins
---
# Standalone: creates, archives, restores, verifies persistence, then deletes
# only its own fixture. Does not clear or alter unrelated local data.
- evalScript: ${output.activityName = 'MRestore' + Date.now()}
- launchApp
- assertVisible:
    id: home-screen

# Create a unique activity using the real creation flow.
- tapOn:
    id: add-activity-button
- assertVisible:
    id: activity-editor-screen
- tapOn:
    id: activity-name-input
- inputText: ${output.activityName}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: level-template-custom
    direction: DOWN
- tapOn:
    id: level-template-custom
- tapOn:
    id: save-activity-button
- assertNotVisible:
    id: activity-editor-screen
- scrollUntilVisible:
    element:
      id: .*activity-card-.+
      containsDescendants:
        - id: .*activity-name-.+
          text: ^${output.activityName}$
    direction: DOWN

# Record one identifiable value, then verify it survives an app restart.
- assertVisible:
    id: .*activity-card-.+
    containsDescendants:
      - id: .*activity-name-.+
        text: ^${output.activityName}$
      - id: .*activity-current-level-.+
        text: ^Not recorded$
- tapOn:
    id: .*activity-slider-.+
    text: '^${output.activityName}, how did it go today\?.*'
    point: 90%,50%
- assertVisible:
    id: .*activity-card-.+
    containsDescendants:
      - id: .*activity-name-.+
        text: ^${output.activityName}$
      - id: .*activity-current-level-.+
        text: ^Quite a bit$
- waitForAnimationToEnd
- stopApp
- launchApp
- assertVisible:
    id: home-screen
- scrollUntilVisible:
    element:
      id: .*activity-card-.+
      containsDescendants:
        - id: .*activity-name-.+
          text: ^${output.activityName}$
    direction: DOWN
- assertVisible:
    id: .*activity-card-.+
    containsDescendants:
      - id: .*activity-name-.+
        text: ^${output.activityName}$
      - id: .*activity-current-level-.+
        text: ^Quite a bit$

# Archive and verify it is removed from Home and listed in Archived.
- tapOn:
    id: .*activity-menu-.+
    text: '^Actions for ${output.activityName}$'
- tapOn:
    id: archive-activity-action
- assertVisible:
    text: '^Archive ${output.activityName}\?$'
- tapOn:
    text: (?i)^Archive$
- extendedWaitUntil:
    notVisible:
      id: .*activity-name-.+
      text: ^${output.activityName}$
    timeout: 20000
- tapOn:
    id: nav-profile
- tapOn:
    id: open-archived-activities
- assertVisible:
    id: archived-activities-screen
- scrollUntilVisible:
    element:
      id: .*archived-activity-name-.+
      text: ^${output.activityName}$
    direction: DOWN
- assertVisible:
    id: .*archived-activity-name-.+
    text: ^${output.activityName}$

# The archive state must persist without clearing SQLite.
- stopApp
- launchApp
- assertVisible:
    id: home-screen
- assertNotVisible:
    text: ^${output.activityName}$
- tapOn:
    id: nav-profile
- tapOn:
    id: open-archived-activities
- assertVisible:
    id: archived-activities-screen
- scrollUntilVisible:
    element:
      id: .*archived-activity-name-.+
      text: ^${output.activityName}$
    direction: DOWN
- assertVisible:
    id: .*archived-activity-name-.+
    text: ^${output.activityName}$
- tapOn:
    id: .*archived-view-insights-.+
    text: '^View insights for ${output.activityName}$'
- assertVisible:
    id: archived-insights-title
    text: ^${output.activityName}$
- assertVisible: Archived
- tapOn:
    id: insights-date-filter
- tapOn:
    text: '^Today \(1D\)$'
- scrollUntilVisible:
    element:
      id: insights-today-rating
    direction: DOWN
- assertVisible:
    id: insights-today-rating
    text: ^Quite a bit$

# Restore the same archived item and confirm its check-in is unchanged.
- scrollUntilVisible:
    element:
      text: ^Back to Archived$
    direction: UP
- tapOn:
    text: ^Back to Archived$
- assertVisible:
    id: archived-activities-screen
- scrollUntilVisible:
    element:
      id: .*restore-activity-.+
      text: '^Restore ${output.activityName}$'
    direction: DOWN
- tapOn:
    id: .*restore-activity-.+
    text: '^Restore ${output.activityName}$'
- extendedWaitUntil:
    notVisible:
      id: .*archived-activity-name-.+
      text: ^${output.activityName}$
    timeout: 20000
- tapOn:
    id: archived-back-to-profile
- tapOn:
    id: nav-home
- assertVisible:
    id: home-screen
- scrollUntilVisible:
    element:
      id: .*activity-card-.+
      containsDescendants:
        - id: .*activity-name-.+
          text: ^${output.activityName}$
    direction: DOWN
- assertVisible:
    id: .*activity-card-.+
    containsDescendants:
      - id: .*activity-name-.+
        text: ^${output.activityName}$
      - id: .*activity-current-level-.+
        text: ^Quite a bit$

# Restoration and the existing entry must both survive another restart.
- stopApp
- launchApp
- assertVisible:
    id: home-screen
- scrollUntilVisible:
    element:
      id: .*activity-card-.+
      containsDescendants:
        - id: .*activity-name-.+
          text: ^${output.activityName}$
    direction: DOWN
- assertVisible:
    id: .*activity-card-.+
    containsDescendants:
      - id: .*activity-name-.+
        text: ^${output.activityName}$
      - id: .*activity-current-level-.+
        text: ^Quite a bit$

# Clean up only this flow's fixture after all persistence assertions pass.
- tapOn:
    id: .*activity-menu-.+
    text: '^Actions for ${output.activityName}$'
- tapOn:
    id: delete-activity-action
- assertVisible:
    text: '^Delete ${output.activityName}\?$'
- tapOn:
    text: (?i)^Delete$
- extendedWaitUntil:
    notVisible:
      id: .*activity-name-.+
      text: ^${output.activityName}$
    timeout: 20000
- tapOn:
    id: nav-profile
- tapOn:
    id: open-archived-activities
- assertVisible:
    id: archived-activities-screen
- assertNotVisible:
    id: .*archived-activity-name-.+
    text: ^${output.activityName}$
