appId: com.plainleaf.tinywins
---
- launchApp
- tapOn:
    id: nav-insights
- scrollUntilVisible:
    element:
      id: insights-activity-all
    direction: UP
- assertVisible:
    id: insights-activity-all
    selected: true
- scrollUntilVisible:
    element:
      id: ^insights-activity-[0-9a-f-]{36}$
    direction: RIGHT
- tapOn:
    id: ^insights-activity-[0-9a-f-]{36}$
- assertVisible:
    id: ^insights-activity-[0-9a-f-]{36}$
    selected: true
- tapOn:
    id: insights-date-filter
- tapOn:
    text: ^Today \(1D\)$
- assertVisible:
    id: insights-date-filter
    text: Date range, 1D
- assertVisible:
    id: insights-chart-rating-trend
- assertVisible:
    id: insights-chart-rating-distribution
- scrollUntilVisible:
    element:
      id: insights-chart-activity-calendar
    direction: DOWN
- assertVisible:
    id: insights-chart-activity-calendar
- scrollUntilVisible:
    element:
      id: insights-section-patterns
    direction: DOWN
- tapOn:
    id: insights-section-patterns
- scrollUntilVisible:
    element:
      id: insights-chart-period-comparison
    direction: DOWN
- assertVisible:
    id: insights-chart-period-comparison
- scrollUntilVisible:
    element:
      id: insights-chart-recording-consistency
    direction: DOWN
- assertVisible:
    id: insights-chart-recording-consistency
- scrollUntilVisible:
    element:
      id: insights-chart-weekday-patterns
    direction: DOWN
- assertVisible:
    id: insights-chart-weekday-patterns

- tapOn:
    id: nav-insights
- scrollUntilVisible:
    element:
      id: insights-activity-all
    direction: UP
- assertVisible:
    id: insights-activity-all
    selected: true
- scrollUntilVisible:
    element:
      id: insights-chart-journey-together
    direction: UP
- assertVisible:
    id: insights-chart-journey-together
- scrollUntilVisible:
    element:
      id: insights-chart-combined-consistency
    direction: DOWN
- assertVisible:
    id: insights-chart-combined-consistency
- scrollUntilVisible:
    element:
      id: insights-chart-combined-calendar
    direction: DOWN
- assertVisible:
    id: insights-chart-combined-calendar
- scrollUntilVisible:
    element:
      id: insights-chart-weekly-checkins
    direction: DOWN
- assertVisible:
    id: insights-chart-weekly-checkins
- tapOn:
    id: nav-home
- assertVisible:
    id: home-screen
