appId: com.plainleaf.tinywins
---
# A single check-in today yields different current-period denominators while
# retaining the same recorded value. This does not touch unrelated data.
- evalScript: ${output.activityName = 'MDate' + Date.now()}
- launchApp
# Open TinyWins from the Expo development client rather than its project picker.
- openLink: exp+tinywins://expo-development-client/?url=http%3A%2F%2F192.168.1.4%3A8081
- runFlow: helpers/create-activity.yaml
- scrollUntilVisible:
    element:
      id: .*activity-slider-.+
      text: '^${output.activityName}, how did it go today\?.*'
    direction: DOWN
- tapOn:
    id: .*activity-slider-.+
    text: '^${output.activityName}, how did it go today\?.*'
- assertVisible:
    id: .*activity-card-.+
    containsDescendants:
      - id: .*activity-name-.+
        text: ^${output.activityName}$
      - id: .*activity-current-level-.+
        text: ^A little$
- scrollUntilVisible:
    element:
      id: .*activity-insights-.+
      text: '^${output.activityName}, insights$'
    direction: DOWN
- tapOn:
    id: .*activity-insights-.+
    text: '^${output.activityName}, insights$'
- tapOn:
    id: insights-date-filter
- tapOn:
    text: '^Today \(1D\)$'
- assertVisible:
    id: insights-date-filter
    text: '^Date range, 1D$'
- assertVisible:
    id: insights-today-rating
    text: ^A little$
- scrollUntilVisible:
    element:
      id: insights-section-patterns
    direction: DOWN
- tapOn:
    id: insights-section-patterns
- scrollUntilVisible:
    element:
      id: period-current-coverage
    direction: DOWN
- assertVisible:
    id: period-current-coverage
    text: ^1 of 1 day$

- tapOn:
    id: insights-date-filter
- tapOn: Last 7 days
- assertVisible:
    id: insights-date-filter
    text: Date range, 7D
- assertVisible:
    id: period-current-coverage
    text: ^1 of 7 days$
- tapOn:
    id: insights-date-filter
- tapOn: Last 30 days
- assertVisible:
    id: insights-date-filter
    text: Date range, 30D
- assertVisible:
    id: period-current-coverage
    text: ^1 of 30 days$
- tapOn:
    id: insights-date-filter
- tapOn: Last 90 days
- assertVisible:
    id: insights-date-filter
    text: Date range, 90D
- assertVisible:
    id: period-current-coverage
    text: ^1 of 90 days$

- tapOn:
    id: insights-date-filter
- tapOn: Custom range
- assertVisible:
    id: custom-date-range-sheet
- assertVisible:
    id: custom-date-from
- assertVisible:
    id: custom-date-to
- tapOn:
    id: custom-date-all-available
- tapOn:
    id: custom-date-apply
- assertVisible:
    id: insights-date-filter
    text: Date range, Custom.*
- assertVisible:
    id: period-current-coverage
    text: ^1 of 1 day$

# Switching ranges never changes the saved check-in.
- tapOn:
    id: nav-home
- scrollUntilVisible:
    element:
      id: .*activity-card-.+
      containsDescendants:
        - id: .*activity-name-.+
          text: ^${output.activityName}$
    direction: DOWN
- assertVisible:
    id: .*activity-card-.+
    containsDescendants:
      - id: .*activity-name-.+
        text: ^${output.activityName}$
      - id: .*activity-current-level-.+
        text: ^A little$
- tapOn:
    id: .*activity-menu-.+
    text: '^Actions for ${output.activityName}$'
- tapOn:
    id: delete-activity-action
- assertVisible:
    text: '^Delete ${output.activityName}\?$'
- tapOn:
    text: (?i)^Delete$
- extendedWaitUntil:
    notVisible:
      id: .*activity-name-.+
      text: ^${output.activityName}$
    timeout: 20000
