appId: com.plainleaf.tinywins
---
- evalScript: ${output.activityName = 'MEmpty' + Date.now()}
- launchApp
- extendedWaitUntil:
    visible:
      id: ^(home-screen|activity-editor-screen|insights-portrait-screen|insights-landscape-screen)$
    timeout: 60000
- runFlow:
    when:
      visible:
        id: activity-editor-screen
    commands:
      - pressKey: BACK
- runFlow:
    when:
      visible:
        id: activity-editor-screen
    commands:
      - pressKey: BACK
- runFlow:
    when:
      visible: Combined Insights is full
    commands:
      - tapOn: OK
- tapOn:
    id: nav-home
- assertVisible:
    id: home-screen
- runFlow:
    when:
      visible: 5 of 5 in Insights
    commands:
      - scrollUntilVisible:
          element:
            text: ^(?!.* not included in combined Insights$).+ included in combined Insights$
          direction: DOWN
      - copyTextFrom:
          text: ^(?!.* not included in combined Insights$).+ included in combined Insights$
      - evalScript: ${output.restoreToggleLabel = maestro.copiedText.replace(' included in combined Insights', ' not included in combined Insights')}
      - tapOn:
          text: ${maestro.copiedText}
      - assertVisible: 4 of 5 in Insights
- runFlow: helpers/create-activity.yaml
- assertVisible:
    id: .*activity-current-level-.+
    text: ^Not recorded$
- tapOn:
    id: .*activity-insights-.+
    text: ${output.activityName}, insights
- tapOn:
    id: insights-date-filter
- tapOn:
    text: ^Today \(1D\)$
- assertVisible:
    id: insights-date-filter
    text: Date range, 1D
- assertVisible:
    id: insights-chart-rating-trend
- assertVisible: Nothing recorded in this period.
- assertVisible:
    id: insights-chart-rating-distribution
- scrollUntilVisible:
    element:
      id: calendar-matching-days
    direction: DOWN
- assertVisible:
    id: calendar-matching-days
    text: ^0 matching days this month$
- scrollUntilVisible:
    element:
      id: insights-section-patterns
    direction: DOWN
- tapOn:
    id: insights-section-patterns
- scrollUntilVisible:
    element:
      id: insights-chart-period-comparison
    direction: DOWN
- assertVisible:
    id: insights-chart-period-comparison
- scrollUntilVisible:
    element:
      id: period-current-coverage
    direction: DOWN
- assertVisible:
    id: period-current-coverage
    text: ^0 of 1 day$
- scrollUntilVisible:
    element:
      id: insights-chart-recording-consistency
    direction: DOWN
- assertVisible:
    id: insights-chart-recording-consistency
- scrollUntilVisible:
    element:
      id: insights-chart-weekday-patterns
    direction: DOWN
- assertVisible:
    id: insights-chart-weekday-patterns
- scrollUntilVisible:
    element:
      text: .*One day is too soon to see a weekly pattern\.$
    direction: DOWN
- assertVisible: .*One day is too soon to see a weekly pattern\.$
- assertNotVisible: NaN
- assertNotVisible: Infinity
- tapOn:
    id: nav-home
- assertVisible:
    id: .*activity-current-level-.+
    text: ^Not recorded$
- runFlow: helpers/delete-activity.yaml
- runFlow:
    when:
      true: ${output.restoreToggleLabel != null}
    commands:
      - scrollUntilVisible:
          element:
            text: ${output.restoreToggleLabel}
          direction: DOWN
      - tapOn:
          text: ${output.restoreToggleLabel}
      - assertVisible: 5 of 5 in Insights
