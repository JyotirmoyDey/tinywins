appId: com.plainleaf.tinywins
---
- launchApp
- tapOn:
    id: nav-insights
- scrollUntilVisible:
    element:
      id: insights-activity-all
    direction: UP
- scrollUntilVisible:
    element:
      id: ^insights-activity-[0-9a-f-]{36}$
    direction: RIGHT
- tapOn:
    id: ^insights-activity-[0-9a-f-]{36}$
- assertVisible:
    id: ^insights-activity-[0-9a-f-]{36}$
    selected: true
- tapOn:
    id: insights-date-filter
- tapOn:
    text: ^Last 7 days$
- assertVisible:
    id: insights-date-filter
    text: Date range, 7D
- assertVisible:
    id: expand-trend-chart
- tapOn:
    id: expand-trend-chart
- assertVisible:
    id: expanded-trend-screen
- extendedWaitUntil:
    visible:
      id: expanded-trend-landscape-chart
    timeout: 20000
- assertVisible:
    id: expanded-trend-plot
- assertNotVisible:
    id: nav-home
- tapOn:
    id: close-expanded-trend
- extendedWaitUntil:
    visible:
      id: insights-portrait-screen
    timeout: 20000
- assertVisible:
    id: insights-date-filter
    text: Date range, 7D
- assertVisible:
    id: insights-chart-rating-trend
- tapOn:
    id: nav-home
- assertVisible:
    id: home-screen
